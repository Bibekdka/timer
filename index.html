<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Engagement Countdown</title>
  <meta name="description" content="Countdown to our engagement day" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap');

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #ffe7f0 0%, #ffdfe8 40%, #e6e6ff 100%);
    }

    .script-font {
      font-family: 'Dancing Script', cursive;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-slow {
      animation: spin 4s linear infinite;
    }

    .heart-bg {
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .time-card {
      min-width: 5rem;
    }

    .sparkle {
      position: absolute;
      will-change: transform, opacity;
    }
  </style>
</head>

<body class="min-h-screen overflow-hidden">
  <div id="app" class="min-h-screen flex items-center justify-center p-4"></div>

  <script>
    (() => {
      const UPLOADED_IMAGE_URL = "uploaded-1x.jpg";

      const TARGET = {
        year: 2025,
        monthIndex: 11,
        day: 10,
        hour: 16,
        minute: 0,
      };

      function timeLeftParts(target) {
        var diff = target - new Date();
        if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0 };

        var s = Math.floor(diff / 1000);
        var days = Math.floor(s / (3600 * 24));
        s -= days * 3600 * 24;

        var hours = Math.floor(s / 3600);
        s -= hours * 3600;

        var minutes = Math.floor(s / 60);
        var seconds = s - minutes * 60;

        return { days, hours, minutes, seconds };
      }

      function getTargetDate() {
        return new Date(
          TARGET.year,
          TARGET.monthIndex,
          TARGET.day,
          TARGET.hour,
          TARGET.minute,
          0
        );
      }

      const ICONS = {
        heart: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,

        sparkles: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" 
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912
        a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12
        l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>`,

        edit2: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" 
        stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`,

        calendar: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" 
        stroke="currentColor" stroke-width="1.6"viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="4" rx="2"/>
        <line x1="16" x2="16" y1="2" y2="6"/>
        <line x1="8" x2="8" y1="2" y2="6"/>
        <line x1="3" x2="21" y1="10" y2="10"/></svg>`,

        pin: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" 
        stroke="currentColor" stroke-width="1.6"viewBox="0 0 24 24">
        <path d="M12 21.7C17.3 17 22 13.5 22 10a7 7 0 1 0-14 0c0 
        3.5 4.7 7 10 11.7z"/>
        <circle cx="12" cy="10" r="3"/></svg>`,

        check: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" 
        stroke="currentColor" stroke-width="1.6"viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/></svg>`,
      };

      const app = document.getElementById("app");

      app.innerHTML = `
      <div class="relative w-full max-w-3xl flex flex-col items-center text-center p-6">
        
        <div id="sparkle-wrap" class="absolute inset-0 pointer-events-none z-30"></div>
        <div id="floating-hearts" class="absolute inset-0 overflow-hidden pointer-events-none z-10"></div>

        <div class="mb-6 space-y-4 w-full">
          <div class="flex items-center justify-center gap-2 text-pink-600">
            <span id="sparkles-left" class="w-5 h-5"></span>
            <span class="text-xs sm:text-sm font-semibold tracking-[0.18em] uppercase">The Big Day Is Coming</span>
            <span id="sparkles-right" class="w-5 h-5"></span>
          </div>

          <div class="relative inline-block">
            <div id="name-view"></div>
            <div id="name-edit" class="hidden"></div>
          </div>

          <div class="flex justify-center">
            <div class="flex items-center gap-2 text-pink-800 bg-white/40 px-4 py-2 rounded-full 
            backdrop-blur-md shadow-sm border border-white/40 font-semibold text-sm">
              <span id="calendar-icon" class="w-4 h-4"></span>
              <span>December 10, 2025 • 4:00 PM</span>
            </div>
          </div>
        </div>

        <div id="timer-grid" class="flex flex-wrap justify-center items-center gap-2 sm:gap-4 mb-6"></div>

        <div class="bg-white/40 backdrop-blur-md p-3 rounded-xl shadow-lg mb-8 w-full max-w-sm 
        border border-white/60">
          <h3 class="text-base font-bold text-pink-800 flex items-center justify-center gap-2 mb-2">
            <span id="pin-icon" class="w-5 h-5"></span>Venue Details
          </h3>
          <p class="text-gray-700 font-medium text-base">Green Hills Resort</p>
          <p class="text-sm text-gray-500 mt-1">Time: 4 PM - 6 PM</p>
        </div>

        <button id="footer-button" type="button"
          class="bg-white/40 backdrop-blur-md px-6 py-3 rounded-full border border-white/60 shadow-lg 
          transition-transform duration-200 font-medium inline-flex items-center gap-3 text-pink-800 
          hover:scale-105">
          <img id="avatar-left" class="w-10 h-10 rounded-full object-cover shadow-md border-2 border-pink-300"/>
          <span class="text-sm">Countdown to Forever</span>
          <img id="avatar-right" class="w-10 h-10 rounded-full object-cover shadow-md border-2 border-pink-300"/>
        </button>

      </div>`;

      document.getElementById("sparkles-left").innerHTML = ICONS.sparkles;
      document.getElementById("sparkles-right").innerHTML = ICONS.sparkles;
      document.getElementById("calendar-icon").innerHTML = ICONS.calendar;
      document.getElementById("pin-icon").innerHTML = ICONS.pin;

      const avatarLeft = document.getElementById("avatar-left");
      const avatarRight = document.getElementById("avatar-right");
      const footerButton = document.getElementById("footer-button");

      const PLACEHOLDER = "https://placehold.co/128x128/ff69b4/ffffff?text=♥";

      avatarLeft.src = PLACEHOLDER;
      avatarRight.src = PLACEHOLDER;

      let imageExists = false;

      const img = new Image();
      img.onload = () => {
        imageExists = true;
        avatarLeft.src = UPLOADED_IMAGE_URL;
        avatarRight.src = UPLOADED_IMAGE_URL;
      };
      img.onerror = () => (imageExists = false);
      img.src = UPLOADED_IMAGE_URL;

      footerButton.onclick = () =>
        imageExists
          ? window.open(UPLOADED_IMAGE_URL, "_blank", "noopener")
          : alert("Image not available.");

      const nameView = document.getElementById("name-view");
      const nameEdit = document.getElementById("name-edit");

      function createNameView(name) {
        nameView.innerHTML = `
        <h1 id="couple-title"
          class="script-font text-3xl sm:text-5xl font-bold bg-clip-text 
          text-transparent bg-gradient-to-r from-pink-600 to-purple-600 cursor-pointer 
          flex items-center justify-center gap-2 py-2">
          <span id="couple-names">${name}</span>
          <span class="text-2xl sm:text-4xl text-pink-400 font-light">&amp;</span>
          <span class="text-base sm:text-xl">Engaged</span>
        </h1>`;
        document.getElementById("couple-title").onclick = enterEditMode;
      }

      function createNameEdit(name) {
        nameEdit.innerHTML = `
        <div class="flex gap-2 bg-white/40 p-2 rounded-xl backdrop-blur-sm shadow-lg 
        w-full max-w-md">
          <input id="name-input" type="text"
            class="flex-1 px-3 py-2 rounded-lg bg-white/80 border border-pink-200 
            focus:ring-2 focus:ring-pink-400 text-gray-800 text-center text-sm"
            placeholder="Enter Names (e.g. Rohan & Priya)" value="${name}"/>

          <button id="save-name" class="p-2 bg-pink-500 text-white rounded-lg">
            <span id="save-icon">${ICONS.check}</span>
          </button>
        </div>`;
        document.getElementById("save-name").onclick = () => {
          const val =
            document.getElementById("name-input").value.trim() || "We";
          localStorage.setItem("engagement_couple_name", val);
          exitEditMode(val);
        };
      }

      function enterEditMode() {
        nameView.classList.add("hidden");
        nameEdit.classList.remove("hidden");
      }

      function exitEditMode(name) {
        nameEdit.classList.add("hidden");
        nameView.classList.remove("hidden");
        createNameView(name);
      }

      const savedName = localStorage.getItem("engagement_couple_name") || "We";
      createNameEdit(savedName);
      createNameView(savedName);

      const timerGrid = document.getElementById("timer-grid");

      function renderUnit(value, label) {
        return `
        <div class="flex flex-col items-center mx-2 my-2">
          <div class="relative group">
            <div class="absolute inset-0 bg-pink-400 blur opacity-20 rounded-2xl"></div>

            <div class="relative bg-white/80 backdrop-blur-md w-20 h-24 sm:w-24 sm:h-32 
            rounded-2xl flex items-center justify-center shadow-xl border border-white/50 time-card">
              <span class="text-3xl sm:text-5xl font-bold text-gray-800">
                ${value < 10 ? "0" + value : value}
              </span>
            </div>
          </div>

          <span class="mt-3 text-sm sm:text-base font-medium text-pink-900">
            ${label}
          </span>
        </div>`;
      }

      function renderTimer() {
        const parts = timeLeftParts(getTargetDate());
        timerGrid.innerHTML =
          renderUnit(parts.days, "Days") +
          `<div class="hidden sm:block text-4xl text-pink-300 font-light pb-8">:</div>` +
          renderUnit(parts.hours, "Hours") +
          `<div class="hidden sm:block text-4xl text-pink-300 font-light pb-8">:</div>` +
          renderUnit(parts.minutes, "Minutes") +
          `<div class="hidden sm:block text-4xl text-pink-300 font-light pb-8">:</div>` +
          renderUnit(parts.seconds, "Seconds");
      }

      renderTimer();
      setInterval(renderTimer, 1000);

      const heartsContainer = document.getElementById("floating-hearts");

      function createHearts(count) {
        heartsContainer.innerHTML = "";
        for (let i = 0; i < count; i++) {
          const d = document.createElement("div");
          d.className = "absolute bottom-[-50px] text-pink-300 heart-bg";
          d.style.left = Math.random() * 100 + "%";
          d.style.animationDuration = 6 + Math.random() * 10 + "s";
          d.style.animationDelay = Math.random() * 5 + "s";

          const size = 10 + Math.random() * 20;
          d.style.width = size + "px";
          d.style.height = size + "px";
          d.style.opacity = 0.3 + Math.random() * 0.4;

          d.innerHTML = ICONS.heart;
          heartsContainer.appendChild(d);
        }
      }

      createHearts(14);

      function spawnSparkles(n) {
        const wrap = document.getElementById("sparkle-wrap");
        wrap.innerHTML = "";

        for (let i = 0; i < n; i++) {
          const s = document.createElement("div");
          s.className = "sparkle";

          const size = 8 + Math.random() * 22;
          s.style.width = size + "px";
          s.style.height = size + "px";
          s.style.left = 10 + Math.random() * 80 + "%";
          s.style.top = 20 + Math.random() * 60 + "%";
          s.style.opacity = "0";
          s.innerHTML = ICONS.sparkles;

          wrap.appendChild(s);

          const duration = 800 + Math.random() * 900;
          const tx = Math.random() * 80 - 40;
          const ty = Math.random() * -120 - 20;

          s.animate(
            [
              { transform: "translate(0,0) scale(0.6)", opacity: 0.9 },
              { transform: `translate(${tx}px,${ty}px) scale(1.1)`, opacity: 0 },
            ],
            { duration, easing: "cubic-bezier(.2,.9,.2,1)" }
          );

          setTimeout(() => s.remove(), duration);
        }
      }

      window.addEventListener("load", () => {
        spawnSparkles(18);
        setTimeout(() => spawnSparkles(8), 900);
      });
    })();
  </script>
</body>
</html>
