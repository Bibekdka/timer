<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Engagement Countdown</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
        }

        .script-font {
            font-family: 'Dancing Script', cursive;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .animate-spin-slow {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .heart-bg {
            animation: float linear infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-100 to-indigo-100 min-h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons Components (Inline SVGs)
        const Heart = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        );

        const Sparkles = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                <path d="M5 3v4" />
                <path d="M9 3v4" />
                <path d="M3 9h4" />
            </svg>
        );

        const Edit2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
            </svg>
        );

        const Check = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12" />
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                <line x1="16" x2="16" y1="2" y2="6" />
                <line x1="8" x2="8" y1="2" y2="6" />
                <line x1="3" x2="21" y1="10" y2="10" />
            </svg>
        );

        function EngagementCountdown() {
            // Default target: Dec 10, 2025 at 10:00 AM
            const [targetDate, setTargetDate] = useState('2025-12-10T10:00');
            const [coupleName, setCoupleName] = useState('We');
            const [isEditing, setIsEditing] = useState(false);
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            // New state for message box
            const [showMessage, setShowMessage] = useState(false); 

            const calculateTimeLeft = () => {
                const difference = +new Date(targetDate) - +new Date();
                if (difference > 0) {
                    return {
                        days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                        minutes: Math.floor((difference / 1000 / 60) % 60),
                        seconds: Math.floor((difference / 1000) % 60)
                    };
                }
                return { days: 0, hours: 0, minutes: 0, seconds: 0 };
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(calculateTimeLeft());
                }, 1000);
                return () => clearInterval(timer);
            }, [targetDate]);

            // Handler for the "Countdown to Forever" click
            const handleImageClick = () => {
                setShowMessage(true);
                // Hide the message after 3 seconds
                setTimeout(() => {
                    setShowMessage(false);
                }, 3000);
            };

            // Floating Background Hearts
            const FloatingHearts = () => {
                const [hearts] = useState(() => [...Array(15)].map((_, i) => ({
                    id: i,
                    left: `${Math.random() * 100}%`,
                    animationDuration: `${6 + Math.random() * 10}s`,
                    delay: `${Math.random() * 5}s`,
                    size: `${10 + Math.random() * 20}px`,
                    opacity: 0.3 + Math.random() * 0.4
                })));

                return (
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        {hearts.map((heart) => (
                            <div
                                key={heart.id}
                                className="absolute bottom-[-50px] text-pink-300 heart-bg"
                                style={{
                                    left: heart.left,
                                    animationDuration: heart.animationDuration,
                                    animationDelay: heart.delay,
                                    width: heart.size,
                                    height: heart.size,
                                    opacity: heart.opacity
                                }}
                            >
                                <Heart className="w-full h-full" />
                            </div>
                        ))}
                    </div>
                );
            };

            const TimeUnit = ({ value, label }) => (
                <div className="flex flex-col items-center mx-2 my-2">
                    <div className="relative group">
                        <div className="absolute inset-0 bg-pink-400 blur opacity-20 group-hover:opacity-40 transition-opacity duration-300 rounded-2xl"></div>
                        <div className="relative bg-white/80 backdrop-blur-md w-20 h-24 sm:w-24 sm:h-32 rounded-2xl flex items-center justify-center shadow-xl border border-white/50">
                            <span className="text-3xl sm:text-5xl font-bold text-gray-800 tabular-nums">
                                {value < 10 ? `0${value}` : value}
                            </span>
                        </div>
                    </div>
                    <span className="mt-3 text-sm sm:text-base font-medium text-pink-900 tracking-wider uppercase">
                        {label}
                    </span>
                </div>
            );

            return (
                <div className="flex flex-col items-center justify-center min-h-screen relative p-4 z-0">
                    <FloatingHearts />

                    {/* Decorative Background Blobs */}
                    <div className="absolute top-0 right-0 w-64 h-64 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse pointer-events-none"></div>
                    <div className="absolute bottom-0 left-0 w-64 h-64 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse delay-1000 pointer-events-none"></div>

                    <div className="relative z-10 w-full max-w-4xl flex flex-col items-center text-center">

                        {/* Header */}
                        <div className="mb-12 space-y-4">
                            <div className="flex items-center justify-center gap-2 text-pink-600 mb-2">
                                <Sparkles className="w-5 h-5 animate-spin-slow" />
                                <span className="text-sm font-semibold tracking-[0.2em] uppercase">The Big Day Is Coming</span>
                                <Sparkles className="w-5 h-5 animate-spin-slow" />
                            </div>

                            <div className="group relative inline-block">
                                {isEditing ? (
                                    <div className="flex flex-col sm:flex-row items-center gap-2 bg-white/40 p-2 rounded-xl backdrop-blur-sm shadow-lg">
                                        <input
                                            type="text"
                                            value={coupleName}
                                            onChange={(e) => setCoupleName(e.target.value)}
                                            className="px-4 py-2 rounded-lg bg-white/80 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-gray-800 text-center"
                                            placeholder="Enter Names (e.g. Rohan & Priya)"
                                        />
                                        <button
                                            onClick={() => setIsEditing(false)}
                                            className="p-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition-colors"
                                        >
                                            <Check className="w-5 h-5" />
                                        </button>
                                    </div>
                                ) : (
                                    <h1
                                        onClick={() => setIsEditing(true)}
                                        className="script-font text-5xl sm:text-7xl md:text-8xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-600 to-purple-600 cursor-pointer hover:opacity-80 transition-opacity flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 py-2"
                                        title="Click to edit names"
                                    >
                                        <span>{coupleName}</span>
                                        <span className="text-4xl sm:text-6xl text-pink-400 font-sans font-light">&</span>
                                        <span>Engaged</span>
                                        <Edit2 className="hidden sm:block w-5 h-5 text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity absolute -right-8 top-1/2 -translate-y-1/2" />
                                    </h1>
                                )}
                            </div>

                            <div className="flex items-center justify-center gap-2 text-gray-600 mt-2 bg-white/30 inline-block px-4 py-1 rounded-full backdrop-blur-sm">
                                <Calendar className="w-4 h-4" />
                                <input
                                    type="datetime-local"
                                    value={targetDate}
                                    onChange={(e) => setTargetDate(e.target.value)}
                                    className="bg-transparent border-none text-gray-700 focus:outline-none text-sm sm:text-lg text-center w-auto cursor-pointer font-medium"
                                />
                            </div>
                        </div>

                        {/* Timer Grid */}
                        <div className="flex flex-wrap justify-center items-center gap-2 sm:gap-4 mb-12">
                            <TimeUnit value={timeLeft.days} label="Days" />
                            <div className="hidden sm:block text-4xl text-pink-300 font-light pb-8">:</div>
                            <TimeUnit value={timeLeft.hours} label="Hours" />
                            <div className="hidden sm:block text-4xl text-pink-300 font-light pb-8">:</div>
                            <TimeUnit value={timeLeft.minutes} label="Minutes" />
                            <div className="hidden sm:block text-4xl text-pink-300 font-light pb-8">:</div>
                            <TimeUnit value={timeLeft.seconds} label="Seconds" />
                        </div>

                        {/* Footer Message (Now Clickable) */}
                        <div 
                            className="bg-white/40 backdrop-blur-md px-8 py-4 rounded-full border border-white/60 shadow-lg transform transition-transform duration-300 cursor-pointer hover:scale-105 hover:shadow-xl"
                            onClick={handleImageClick}
                            title="Click to add a photo link"
                        >
                            <div className="flex items-center gap-2 text-pink-800 font-medium">
                                <Heart className="w-5 h-5 text-red-500 fill-current animate-pulse" />
                                <span>Countdown to Forever</span>
                                <Heart className="w-5 h-5 text-red-500 fill-current animate-pulse" />
                            </div>
                        </div>
                        
                        {/* Temporary Message Box */}
                        {showMessage && (
                            <div className="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-xl shadow-2xl transition-opacity duration-300 animate-fadeIn">
                                Image Feature Clicked! (Future update will allow adding an image URL here.)
                            </div>
                        )}
                        
                        <style jsx>{`
                            @keyframes fadeIn {
                                from { opacity: 0; transform: translateY(20px) translate-x(-50%); }
                                to { opacity: 1; transform: translateY(0) translate-x(-50%); }
                            }
                            .animate-fadeIn {
                                animation: fadeIn 0.3s ease-out;
                            }
                        `}</style>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EngagementCountdown />);
    </script>
</body>
</html>
